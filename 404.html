<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="This page could not be found. Head back to My Wow Pet to keep browsing.">
  <title>Page Not Found | My Wow Pet</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/images/icon-192x192.png" sizes="192x192">
  <meta name="theme-color" content="#D4A853">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8) var(--space-4);
      background: var(--color-bg);
    }
    .not-found__code {
      font-family: var(--font-heading);
      font-size: var(--fs-6xl);
      color: var(--color-primary);
      line-height: var(--lh-tight);
      margin-bottom: var(--space-4);
    }
    .not-found__title {
      font-family: var(--font-heading);
      font-size: var(--fs-3xl);
      color: var(--color-text);
      margin-bottom: var(--space-4);
    }
    .not-found__text {
      color: var(--color-text-secondary);
      max-width: 32rem;
      margin: 0 auto var(--space-8);
    }
    .not-found__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="container">
      <p class="not-found__code" aria-hidden="true">404</p>
      <h1 class="not-found__title">This page wandered off</h1>
      <p class="not-found__text">We could not find the page you were looking for. It may have moved, or the link may be out of date.</p>
      <nav class="not-found__actions" aria-label="Helpful links">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-outline" href="/shop">Browse the shop</a>
        <a class="btn btn-outline" href="/help">Visit the Help Center</a>
      </nav>
    </div>
  </main>
</body>
</html>
