title = "My Wow Pet Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Shopify Storefront access tokens are public browser client identifiers for this custom storefront."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)js/store\.js$''',
]
regexes = [
  '''storefrontAccessToken:\s*['"][a-f0-9]{32}['"]''',
]

[[rules.allowlists]]
description = "Firebase Web API keys are public browser client identifiers; access is enforced by Auth and Firestore rules."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)js/firebase-db\.js$''',
]
regexes = [
  '''apiKey:\s*["']AIza[0-9A-Za-z_-]+["']''',
]
